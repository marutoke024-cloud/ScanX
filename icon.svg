    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB04A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB04A"/>
